<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs><clipPath id="frame"><path d="M24 240 V122 C24 76 56 44 100 18 C144 44 176 76 176 122 V240 Z"/></clipPath></defs>
