<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs><clipPath id="frame"><path d="M18 48 H32 V32 H168 V48 H182 V240 H18 Z"/></clipPath></defs>
  <!-- John Hudson Thomas: a Secession square, notched, vermilion -->
  <path d="M18 48 H32 V32 H168 V48 H182 V240 H18 Z" fill="#E4592B"/>
  <g clip-path="url(#frame)">
    <!-- lounge suit -->
    <path d="M10 240 C18 204 54 190 100 188 C146 190 182 204 190 240 Z" fill="#2E2A27"/>
    <!-- a high stiff collar -->
    <path d="M84 164 H116 V186 L100 191 L84 186 Z" fill="#FDFAF2"/>
    <!-- a tie in the Viennese manner: squares -->
    <path d="M94 187 H106 L110 222 L100 232 L90 222 Z" fill="#0B2E8C"/>
    <path d="M97 195 h6 v6 h-6 Z M97 209 h6 v6 h-6 Z" fill="#FDFAF2"/>
    <!-- neck, ears, a long face -->
    <path d="M91 146 H109 V170 H91 Z" fill="#F4CDB9"/>
    <ellipse cx="72" cy="108" rx="7" ry="10" fill="#F4CDB9"/>
    <ellipse cx="128" cy="108" rx="7" ry="10" fill="#F4CDB9"/>
    <path d="M74 98 C72 134 86 158 100 160 C114 158 128 134 126 98 C124 74 112 62 100 62 C88 62 76 74 74 98 Z" fill="#F4CDB9"/>
    <!-- dark hair parted dead centre, swept out like wings -->
    <path d="M71 106 C65 72 82 54 100 54 C118 54 135 72 129 106 C127 90 121 80 111 76 C106 77 102 80 100 85 C98 80 94 77 89 76 C79 80 73 90 71 106 Z" fill="#2E2A27"/>
    <!-- straight brows, a level gaze -->
    <path data-anim="brow" d="M81 96 H94 M106 96 H119" stroke="#2E2A27" stroke-width="2.6" stroke-linecap="round"/>
    <circle data-anim="eye" cx="87" cy="104" r="2.4" fill="#2E2A27"/>
    <circle data-anim="eye" cx="113" cy="104" r="2.4" fill="#2E2A27"/>
    <path d="M100 102 L97 119 L102 120" stroke="#2E2A27" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- a thin moustache -->
    <path d="M84 128 C90 123 96 123 100 125 C104 123 110 123 116 128 C110 130 104 130 100 129 C96 130 90 130 84 128 Z" fill="#2E2A27"/>
    <path data-anim="mouth" d="M93 139 Q100 139 107 139" data-smile="M92 137 Q100 144 108 137" stroke="#2E2A27" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
