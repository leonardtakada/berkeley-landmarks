<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs><clipPath id="frame"><path d="M34 12 H166 V240 H34 Z"/></clipPath></defs>
  <!-- John Galen Howard: the tall panel, blue -->
  <path d="M34 12 H166 V240 H34 Z" fill="#0B2E8C"/>
  <g clip-path="url(#frame)">
    <!-- frock coat -->
    <path d="M26 240 C32 204 62 190 100 188 C138 190 168 204 174 240 Z" fill="#2E2A27"/>
    <!-- shirt front and wing collar -->
    <path d="M86 188 L100 226 L114 188 Z" fill="#FDFAF2"/>
    <path d="M86 170 C92 176 108 176 114 170 L116 188 L100 184 L84 188 Z" fill="#FDFAF2"/>
    <!-- bow tie -->
    <path d="M100 186 L84 178 L84 194 Z M100 186 L116 178 L116 194 Z" fill="#E4592B"/>
    <rect x="95" y="181" width="10" height="10" rx="2" fill="#E4592B"/>
    <!-- neck, ears, face -->
    <path d="M90 146 H110 V174 H90 Z" fill="#F4CDB9"/>
    <ellipse cx="71" cy="106" rx="7" ry="10" fill="#F4CDB9"/>
    <ellipse cx="129" cy="106" rx="7" ry="10" fill="#F4CDB9"/>
    <path d="M72 94 C70 130 84 150 100 154 C116 150 130 130 128 94 C124 74 112 66 100 66 C88 66 76 74 72 94 Z" fill="#F4CDB9"/>
    <!-- hair combed back, a side parting -->
    <path d="M70 102 C62 68 80 52 102 52 C124 52 138 68 130 102 C128 88 124 80 116 76 C104 72 90 74 80 82 C74 88 72 94 70 102 Z" fill="#2E2A27"/>
    <!-- level brows, steady eyes -->
    <path data-anim="brow" d="M80 94 H93 M107 94 H120" stroke="#2E2A27" stroke-width="3" stroke-linecap="round"/>
    <circle data-anim="eye" cx="87" cy="103" r="2.4" fill="#2E2A27"/>
    <circle data-anim="eye" cx="113" cy="103" r="2.4" fill="#2E2A27"/>
    <path d="M100 100 L97 116 L102 117" stroke="#2E2A27" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the moustache -->
    <path data-anim="mouth" d="M100 124 C92 118 80 120 72 132 C80 130 90 130 100 131 C110 130 120 130 128 132 C120 120 108 118 100 124 Z" data-smile="M100 124 C92 118 80 118 71 126 C80 127 90 129 100 130 C110 129 120 127 129 126 C120 118 108 118 100 124 Z" fill="#2E2A27"/>
  </g>
</svg>
