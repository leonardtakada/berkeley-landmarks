<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs><clipPath id="frame"><path d="M16 38 H184 V222 H16 Z"/></clipPath></defs>
  <!-- Walter Ratcliff: the square, vermilion tint -->
  <path d="M16 38 H184 V222 H16 Z" fill="#F4CDB9"/>
  <g clip-path="url(#frame)">
    <!-- lounge suit -->
    <path d="M8 222 C14 190 50 174 100 172 C150 174 186 190 192 222 Z" fill="#0B2E8C"/>
    <path d="M86 172 L100 210 L114 172 Z" fill="#FDFAF2"/>
    <path d="M96 176 H104 L107 204 L100 212 L93 204 Z" fill="#E4592B"/>
    <!-- neck, ears, round face -->
    <path d="M90 142 H110 V174 H90 Z" fill="#FDFAF2"/>
    <ellipse cx="66" cy="114" rx="7" ry="10" fill="#FDFAF2"/>
    <ellipse cx="134" cy="114" rx="7" ry="10" fill="#FDFAF2"/>
    <circle cx="100" cy="114" r="35" fill="#FDFAF2"/>
    <!-- hair slicked flat, parted dead centre -->
    <path d="M65 108 C62 78 80 64 100 64 C120 64 138 78 135 108 C132 90 122 82 108 82 C104 84 96 84 92 82 C78 82 68 90 65 108 Z" fill="#2E2A27"/>
    <path d="M100 66 L100 82" stroke="#F4CDB9" stroke-width="1.4" stroke-linecap="round"/>
    <!-- heavy round spectacles, eyes crinkled -->
    <circle cx="86" cy="112" r="11" fill="none" stroke="#2E2A27" stroke-width="3"/>
    <circle cx="114" cy="112" r="11" fill="none" stroke="#2E2A27" stroke-width="3"/>
    <path d="M97 111 Q100 108 103 111" stroke="#2E2A27" stroke-width="2.4" fill="none"/>
    <path data-anim="eye" d="M81 113 Q86 109 91 113 M109 113 Q114 109 119 113" stroke="#2E2A27" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- a broad grin -->
    <path data-anim="mouth" d="M86 130 Q100 142 114 130 Z" data-smile="M83 128 Q100 149 117 128 Z" fill="#E4592B"/>
  </g>
</svg>
