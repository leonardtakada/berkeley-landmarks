<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guide">
<meta name="theme-color" content="#FAF6EC">
<title>Guide editor</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --page: #FAF6EC; --slip: #FDFAF2; --line: #DDD5C2; --blue: #0B2E8C; --vermilion: #E4592B; --ink: #2E2A27; --sepia: #7A6E62; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #1B1A18; --slip: #232220; --line: #3A3733; --blue: #8FA6F0; --vermilion: #F07A52; --ink: #EDE7DB; --sepia: #A89E91; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: min(380px, 100%); background: var(--slip); border: 1px solid var(--line); border-radius: 12px; padding: 26px 22px; display: grid; gap: 14px; }
  h1 { margin: 0; font: 500 17px system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); }
  p { margin: 0; color: var(--sepia); font-size: 15px; }
  input[type=password] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--page); color: var(--ink); font: 600 20px/1 ui-monospace, Menlo, monospace; letter-spacing: 2px; }
  input:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: transparent; }
  button { padding: 13px 16px; border: 0; border-radius: 8px; background: var(--blue); color: var(--page); font: 500 16px system-ui, sans-serif; }
  button:disabled { opacity: .5; }
  #err { color: var(--vermilion); min-height: 1.4em; font-size: 15px; }
  .quiet { position: absolute; left: -9999px; }
</style>
</head>
<body>
<form id="f" method="post" action="/login">
  <h1>Guide editor</h1>
  <p>Enter the passcode shown on the Mac, under Phone in the editor.</p>
  <input class="quiet" type="text" name="username" value="Guide editor" autocomplete="username" tabindex="-1" aria-hidden="true">
  <input id="p" type="password" name="password" autocomplete="current-password" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Passcode" autofocus required>
  <div id="err" role="alert"></div>
  <button id="go" type="submit">Open the editor</button>
</form>
<script>
"use strict";
const f = document.getElementById("f"), p = document.getElementById("p"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true;
  err.textContent = "";
  try {
    const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passcode: p.value }) });
    const out = await res.json().catch(() => ({}));
    if (res.ok) return location.reload();
    err.textContent = out.error || "That didn't work.";
  } catch {
    err.textContent = "Couldn't reach the editor.";
  }
  go.disabled = false;
});
</script>
</body>
</html>
