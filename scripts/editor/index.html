<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guide">
<meta name="theme-color" content="#FAF6EC">
<title>Guide editor</title>
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B2E8C'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' fill='none' stroke='%23F2F0E6' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root {
    --page: #FAF6EC; --slip: #FDFAF2; --shade: #E6DFCC; --line: #DDD5C2;
    --blue: #0B2E8C; --blue-tint: #C9D0E4; --vermilion: #E4592B; --vermilion-tint: #F4CDB9;
    --ink: #2E2A27; --sepia: #7A6E62; --faded: #A79C8E;
    --ok: #2F6B4F; --ok-tint: #D8E8DD; --warn-tint: #F7E7C2; --warn: #7A5A10;
    --font: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1B1A18; --slip: #232220; --shade: #2D2B28; --line: #3A3733;
      --blue: #8FA6F0; --blue-tint: #2A3560; --vermilion: #F07A52; --vermilion-tint: #4A2A1F;
      --ink: #EDE7DB; --sepia: #A89E91; --faded: #7C746A;
      --ok: #7FC4A0; --ok-tint: #213529; --warn-tint: #3C3217; --warn: #E6C46A;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Header */
  header { display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 54px; flex: none; border-bottom: 1px solid var(--line); background: var(--slip); }
  header h1 { font: 500 17px var(--font); letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { border: 0; background: none; padding: 7px 14px; border-radius: 6px; font: 500 14px var(--font); color: var(--sepia); }
  nav button[aria-selected="true"] { background: var(--blue); color: var(--page); }
  nav .count { opacity: .7; margin-left: 6px; font-weight: 400; }
  .grow { flex: 1; }
  header .tools { display: flex; gap: 8px; align-items: center; }

  /* Buttons */
  .btn { white-space: nowrap; border: 1px solid var(--line); background: var(--slip); padding: 6px 13px; border-radius: 6px; font-weight: 500; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--page); }
  .btn.danger { color: var(--vermilion); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.icon { padding: 3px 8px; }

  /* Two panes */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--slip); }
  .filters { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .list { overflow: auto; flex: 1; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; color: var(--sepia); font-size: 12.5px; }
  .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 14px 9px 12px; border-left: 3px solid transparent; }
  .item[aria-current="true"] { background: var(--blue-tint); border-left-color: var(--blue); }
  .item .name { font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .item .sub { color: var(--sepia); font-size: 12.5px; margin-left: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .flag { margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--warn-tint); color: var(--warn); font-weight: 500; }
  .banner { margin: 10px 12px 0; padding: 9px 11px; background: var(--warn-tint); color: var(--warn); border-radius: 6px; font-size: 13px; }
  .banner button { margin-top: 6px; }

  section.detail { overflow: auto; min-height: 0; position: relative; }
  .empty { color: var(--sepia); padding: 60px 30px; text-align: center; max-width: 460px; margin: 0 auto; }
  .empty h2 { font: 500 20px var(--font); color: var(--ink); margin: 0 0 8px; }

  /* Form */
  .bar { position: sticky; top: 0; z-index: 500; display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: var(--page); border-bottom: 1px solid var(--line); }
  .bar h2 { font: 500 20px var(--font); margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .id { font-size: 12px; color: var(--sepia); margin-left: 8px; font-weight: 400; letter-spacing: .5px; }
  .form { padding: 18px 24px 80px; max-width: 920px; display: grid; gap: 18px; }
  .card { background: var(--slip); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; }
  .card > h3 { font: 500 11.5px var(--font); letter-spacing: 2px; text-transform: uppercase; color: var(--sepia); margin: 0; }
  .row { display: grid; gap: 12px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .row.lead { grid-template-columns: 2fr 1fr; }
  label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--sepia); font-weight: 500; }
  label.f .hint { font-weight: 400; color: var(--faded); }
  input[type=text], input[type=url], select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); }
  input[readonly] { color: var(--sepia); background: var(--shade); }
  textarea { resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: transparent; }
  input[type=color] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); font-weight: 400; }

  .notice { padding: 10px 13px; border-radius: 6px; font-size: 13.5px; }
  .notice.err { background: var(--vermilion-tint); color: var(--vermilion); }
  .notice.ok { background: var(--ok-tint); color: var(--ok); }
  .notice.warn { background: var(--warn-tint); color: var(--warn); }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  .notice .btn { margin-top: 8px; }

  .map { height: 280px; border-radius: 6px; border: 1px solid var(--line); background: var(--shade); z-index: 0; }
  .map.tall { height: 340px; }
  .map-note { color: var(--sepia); font-size: 12.5px; }
  .pin { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--vermilion); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .num { width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; color: #fff; font: 600 12px/24px var(--font); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  .photo { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: start; }
  .thumb { width: 84px; height: 64px; border-radius: 4px; background: var(--shade); object-fit: cover; border: 1px solid var(--line); }
  .photo .fields { display: grid; gap: 6px; }
  .btns2 { display: grid; gap: 6px; align-content: start; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .card.dropping { outline: 2px dashed var(--blue); outline-offset: -5px; }

  /* Stops */
  .stop { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stop:last-of-type { border-bottom: 0; }
  .stop .n { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 12px/24px var(--font); text-align: center; }
  .stop .who b { font-weight: 500; }
  .stop .who small { display: block; color: var(--sepia); font-size: 12.5px; }
  .stop .btns { display: flex; gap: 4px; }
  .picker { position: relative; margin-top: 4px; }
  .results { position: absolute; left: 0; right: 0; top: 100%; z-index: 600; background: var(--slip); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); max-height: 300px; overflow: auto; }
  .results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 11px; }
  .results small { color: var(--sepia); }
  .used a { color: var(--blue); cursor: pointer; text-decoration: underline; }
  table.diff { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
  table.diff td, table.diff th { text-align: left; vertical-align: top; padding: 3px 8px 3px 0; border-top: 1px solid rgba(0,0,0,.1); }
  table.diff td { max-width: 280px; overflow-wrap: anywhere; }

  .import-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .import-row small { color: var(--sepia); }
  .import-row { cursor: pointer; }

  /* Hover colours only where there is a pointer: on a touch screen they would stick after a tap. */
  @media (hover: hover) {
    nav button:not([aria-selected="true"]):hover { background: var(--shade); }
    .btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
    .btn.primary:hover:not(:disabled) { color: var(--page); filter: brightness(1.15); }
    .btn.danger:hover:not(:disabled) { border-color: var(--vermilion); color: var(--vermilion); }
    .item:hover { background: var(--shade); }
    .results button:hover { background: var(--blue-tint); }
  }
  .results button.on { background: var(--blue-tint); }
  .back, .only-phone { display: none; }
  .actions { display: contents; }
  .overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; overflow: auto; }
  .sheet { background: var(--page); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 20px 22px; display: grid; gap: 14px; }
  .sheet h2 { font: 500 20px var(--font); margin: 0; }
  .sheet .lines { display: grid; gap: 10px; }
  .way { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--slip); }
  .way b { font-weight: 500; }
  .way small { color: var(--sepia); grid-column: 1; overflow-wrap: anywhere; }
  .way img { grid-column: 2; grid-row: 1 / span 2; width: 132px; height: 132px; border-radius: 4px; background: #fff; }
  .code { font: 600 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; padding: 12px; background: var(--slip); border: 1px solid var(--line); border-radius: 8px; text-align: center; user-select: all; }
  .sheet ol { margin: 0; padding-left: 20px; color: var(--sepia); display: grid; gap: 4px; }
  .dot-on { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: 6px; }
  details.phone-tools summary { cursor: pointer; padding: 10px 14px; color: var(--sepia); font-weight: 500; }
  details.phone-tools .btnrow { padding: 0 14px 12px; }

  /* Console */
  #console { flex: none; border-top: 1px solid var(--line); background: var(--slip); display: none; }
  #console.on { display: block; }
  #console header { height: 38px; padding: 0 16px; border-bottom: 1px solid var(--line); gap: 12px; font-size: 13px; background: none; }
  #console pre { margin: 0; padding: 10px 16px; height: 200px; overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--faded); }
  .led.running { background: var(--warn); animation: blink 1s ease-in-out infinite; }
  .led.ok { background: var(--ok); }
  .led.failed { background: var(--vermilion); }
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .led.running { animation: none; } }

  @media (max-width: 900px) {
    .row.two, .row.three, .row.lead { grid-template-columns: 1fr; }
  }

  /* On a phone: one screen at a time (the list, then the place), the page itself scrolls, and Save sits under the thumb. */
  @media (max-width: 820px) {
    html, body { height: auto; }
    body { display: block; font-size: 16px; -webkit-text-size-adjust: 100%; }
    body[data-view="detail"] > header, body[data-view="detail"] aside { display: none; }
    body[data-view="list"] section.detail { display: none; }
    body > header { position: sticky; top: 0; z-index: 800; height: auto; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); gap: 10px; }
    header h1 { font-size: 14px; letter-spacing: 1.5px; }
    body > header .grow, body > header .tools { display: none; }
    nav { flex: 1; justify-content: flex-end; }
    nav button { padding: 10px 14px; font-size: 15px; }
    main { display: block; }
    aside { max-height: none; border: 0; display: block; }
    .list { overflow: visible; }
    section.detail { overflow: visible; }
    .only-phone { display: block; }
    .card.only-phone { display: grid; }
    .back { display: inline-flex; align-items: center; justify-content: center; }

    .filters { padding: 12px 14px; }
    .list-head { padding: 10px 14px; font-size: 14px; }
    .item { padding: 13px 16px 13px 14px; }
    .item .name { font-size: 16px; }
    .item .sub { font-size: 13.5px; }
    .banner { display: none; } /* housekeeping for the desktop */

    input[type=text], input[type=url], select, textarea { font-size: 16px; padding: 11px 12px; min-height: 46px; border-radius: 8px; }
    textarea { min-height: 120px; }
    label.f { font-size: 14px; }
    .btn { min-height: 44px; padding: 10px 16px; font-size: 15px; border-radius: 8px; }
    .btn.small { min-height: 42px; padding: 8px 14px; font-size: 14.5px; }
    .btn.icon { min-width: 44px; }
    .check { font-size: 16px; }
    .check input { width: 22px; height: 22px; }

    .bar { top: 0; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); padding-left: max(12px, env(safe-area-inset-left)); gap: 6px; }
    .bar h2 { font-size: 17px; }
    .bar .id { display: none; }
    .back { flex: none; min-width: 44px; font-size: 22px; padding: 0 10px; }
    .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; display: flex; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--slip); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.1); }
    .actions.idle { display: none; }
    .actions .btn.primary { flex: 1; }
    .actions .btn.danger { display: none; }

    .form { padding: 14px 12px 130px; gap: 14px; max-width: none; }
    .card { padding: 14px; }
    .c-place { order: 1; } .c-photos { order: 2; } .c-building { order: 3; } .c-map { order: 4; } .used { order: 5; } .c-danger { order: 9; }
    .map { height: 320px; } .map.tall { height: 360px; }

    .photo { grid-template-columns: 1fr; }
    .thumb { width: 100%; height: auto; max-height: 240px; object-fit: contain; }
    .thumb[src=""] { display: none; }
    .btns2 { grid-auto-flow: column; grid-auto-columns: max-content; }
    .stop { grid-template-columns: 30px 1fr; }
    .stop input, .stop .btns { grid-column: 1 / -1; }
    .stop .btns { justify-content: flex-end; gap: 8px; }
    .results button { padding: 12px 12px; }

    #console { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 1500; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); overflow: hidden; }
    #console header { position: static; height: 46px; padding: 0 12px; }
    #console pre { display: none; height: 40vh; }
    #console.open pre { display: block; }
    .overlay { place-items: end center; padding: 0; }
    .sheet { border-radius: 14px 14px 0 0; width: 100%; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>
  <h1>Guide editor</h1>
  <nav role="tablist" id="tabs"></nav>
  <span class="grow"></span>
  <div class="tools" id="tools"></div>
</header>
<main>
  <aside id="side"></aside>
  <section class="detail" id="detail"></section>
</main>
<div id="console">
  <header><span class="led" id="led"></span><strong id="job-label"></strong><span id="job-status" style="color:var(--sepia)"></span><span class="grow"></span><button class="btn small" id="close-console">Hide</button></header>
  <pre id="job-out"></pre>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------

function add(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
}

/** h("div", { class: "x", onclick }, ...children): elements without innerHTML, so nothing typed into the guide can run. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  add(el, kids);
  return el;
}

const $ = (id) => document.getElementById(id);
const clone = (x) => JSON.parse(JSON.stringify(x));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;

async function api(method, path, data) {
  let res;
  try {
    res = await fetch("/api" + path, {
      method,
      headers: method === "GET" ? {} : { "Content-Type": "application/json" },
      body: data === undefined ? undefined : JSON.stringify(data),
    });
  } catch {
    throw new Error("Can't reach the editor. Is the Mac awake, and is this phone on the same Wi-Fi or Tailscale?");
  }
  // A phone whose sign-in has lapsed (or was reset) is sent back to the passcode page.
  if (res.status === 401) { location.reload(); throw new Error("Signing in again…"); }
  const out = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(out.error || res.statusText);
    e.details = out.details || [];
    throw e;
  }
  return out;
}

// Berkeley, with longitude scaled for the latitude, as the data checks measure.
const K = Math.cos((37.87 * Math.PI) / 180);
const metres = (a, b) => Math.hypot((a.longitude - b.longitude) * K, a.latitude - b.latitude) * 111320;
const miles = (m) => (m / 1609.344).toFixed(2).replace(/0$/, "");

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let S = null; // what the server last sent
let byId = new Map();
let tab = "landmarks";
const pick = { landmarks: null, tours: null }; // selected id, "new", or "import"
let draft = null;
let baseline = "";
let dirty = false;
let notice = null; // { kind, text, list, action }
const filters = { q: "", cat: "", flag: "" };
let map = null;

const phoneQuery = window.matchMedia("(max-width: 820px)");
const onPhone = () => phoneQuery.matches;
/** On a phone only one screen shows at a time: the place when one is chosen, otherwise the list. */
const setView = () => { document.body.dataset.view = pick[tab] ? "detail" : "list"; };
const toTop = () => { $("detail").scrollTop = 0; window.scrollTo(0, 0); };
let listScroll = 0;

const CENTER = [37.8716, -122.2727];

function blankLandmark() {
  return {
    id: "", name: "", address: "", latitude: "", longitude: "", architect: "", yearBuilt: "",
    category: "residential", landmarkNumber: "", description: "", style: "", nationalRegister: false,
    neighborhood: "", designationType: "", photoUrl: "", photos: [],
    // Who took the lead photograph when it is an upload (a gallery row has its own credit).
    credits: {},
  };
}

function blankTour() {
  return { id: "", name: "", neighborhood: "", description: "", author: "Berkeley Tours", color: "#0B2E8C", stops: [] };
}

function toDraft(kind, id) {
  if (id === "new") return kind === "landmarks" ? blankLandmark() : blankTour();
  if (kind === "landmarks") {
    const l = clone(byId.get(id));
    const photos = (l.photos || []).map((p) => (isUpload(p.url) && !p.credit ? { ...p, credit: (S.uploads[p.url] || {}).credit || "" } : p));
    const credits = l.photoUrl && isUpload(l.photoUrl) ? { [l.photoUrl]: (S.uploads[l.photoUrl] || {}).credit || "" } : {};
    return { ...blankLandmark(), ...l, designationType: l.designationType || "", photoUrl: l.photoUrl || "", photos, credits };
  }
  const t = clone(S.tours.find((x) => x.id === id));
  return {
    id: t.id, name: t.name, neighborhood: t.neighborhood, description: t.description, author: t.author, color: t.color,

// Uploaded photographs are named upload:u-<hash>.jpg; the server shows them at /photo/.
const isUpload = (u) => /^upload:u-[0-9a-f]{12}\.jpg$/.test(u || "");
const previewSrc = (u) => (isUpload(u) ? "/photo/" + u.slice("upload:".length) : u || "");
/** What each print in this session measured, for the row that shows it. */
const printed = {};

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("Couldn't read that file"));
    r.readAsDataURL(file);
  });
}

/**
 * A phone's photograph is 3-8 MB and, from the library, may be HEIC. Redrawn here at 2400 px as a JPEG it is a few hundred KB (quick over
 * Wi-Fi or Tailscale) and upright; the server still prints it at 960. If the browser can't redraw it, the original goes as it is.
 */
const SEND_SIDE = 2400;
async function shrink(file) {
  if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size < 700_000) return file;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const k = Math.min(1, SEND_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * k));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * k));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]*$/, "") + ".jpg", { type: "image/jpeg" });
  } catch {
    return file;
  } finally {
    URL.revokeObjectURL(url);
  }
}

const sendPhoto = async (file) => api("POST", "/photos", { data: await readBase64(await shrink(file)), name: file.name });

/** Who took the last photograph uploaded from this browser, offered for the next (the credit is required, and awkward to type on a phone). */
const CREDIT_KEY = "guide-editor-credit";
const lastCredit = () => { try { return localStorage.getItem(CREDIT_KEY) || ""; } catch { return ""; } };
const rememberCredit = (v) => { try { if (v.trim()) localStorage.setItem(CREDIT_KEY, v.trim()); } catch { /* private browsing */ } };

/** "5" and "# 5" are written #5; anything else ("UC…") is left as typed. */
const tidyNumber = (v) => {
  const m = /^#?\s*(\d+)$/.exec(v.trim());
  return m ? "#" + Number(m[1]) : v.trim();
};

function field(label, input, hint) {

}

function bound(key, opts = {}) {

  return h(tag, {
    type: opts.area ? undefined : "text", value: draft[key] ?? "", rows: opts.rows, placeholder: opts.placeholder, readOnly: opts.readOnly,
    inputMode: opts.numeric ? "decimal" : undefined, spellcheck: opts.area || key === "name" || key === "description" ? true : false,
    onInput: (e) => { draft[key] = e.target.value; touch(); if (opts.after) opts.after(e.target.value); },
  });

function select$(key, options, blank) {

}

const haveMap = () => typeof L !== "undefined";
const mapMissing = () => h("div", { class: "map-note" }, "The map needs a connection to load.");

function landmarkForm() {
  const isNew = pick.landmarks === "new";
  const d = draft;
  const drift = !isNew && S.drift.find((x) => x.id === d.id);
  let marker = null;
  let lat$, lng$;

  const hasCoords = () => isFinite(parseFloat(d.latitude)) && isFinite(parseFloat(d.longitude));
  const original = isNew ? null : byId.get(d.id);
  let autoPlaced = false; // the pin came from the address, not from a hand
  let lookupId = 0;
  let timer = null;

  const place = (lat, lng, how) => {
    d.latitude = Number(lat).toFixed(6);
    d.longitude = Number(lng).toFixed(6);
    autoPlaced = how === "address";
    suggestion.replaceChildren();
    if (lat$) { lat$.value = d.latitude; lng$.value = d.longitude; }
    if (marker) { marker.setLatLng([lat, lng]); marker.setOpacity(1); }
    touch();
  };
  const moved = () => {
    autoPlaced = false;
    const lat = parseFloat(d.latitude), lng = parseFloat(d.longitude);
    if (marker && isFinite(lat) && isFinite(lng)) { marker.setLatLng([lat, lng]); map.panTo([lat, lng]); }
  };
  lat$ = bound("latitude", { numeric: true, after: moved });
  lng$ = bound("longitude", { numeric: true, after: moved });

  const mapBox = h("div", { class: "map" });
  const geocodeNote = h("span", { class: "map-note" }, isNew
    ? "Type the street address and the pin is placed for you; or click the map. The grey dots are the guide's other places."
    : "Click the map or drag the pin to place it. The grey dots are the guide's other places.");
  const suggestion = h("div");

  /** Asks where the address is. "button" always places the pin; "typing" never overrides a pin placed by hand. */
  const lookUp = async (how) => {
    const address = d.address.trim();
    if (!address) { geocodeNote.textContent = "Type the address first."; return; }
    const mine = ++lookupId;
    geocodeNote.textContent = "Looking up the address…";
    let results;
    try {
      results = (await api("GET", "/geocode?q=" + encodeURIComponent(address))).results;
    } catch (e) {
      if (mine === lookupId) geocodeNote.textContent = e.message;
      return;
    }
    if (mine !== lookupId) return; // the address has changed since
    const hit = results[0];
    if (!hit) { geocodeNote.textContent = "No match for that address. Place the pin by hand."; return; }
    const check = hit.building ? "Check the pin is on the building." : "Only the street was found. Drag the pin onto the building.";
    if (how === "typing" && hasCoords() && !autoPlaced) {
      // An existing pin is never moved on its own; the move is offered.
      const away = metres({ latitude: parseFloat(d.latitude), longitude: parseFloat(d.longitude) }, hit);
      if (away < 15) { geocodeNote.textContent = "The pin already matches this address."; return; }
      geocodeNote.textContent = `This address is ${Math.round(away)} m from the pin.`;
      suggestion.replaceChildren(h("button", { class: "btn small", type: "button", onclick: () => {
        place(hit.latitude, hit.longitude, "address");
        if (map) map.setView([hit.latitude, hit.longitude], 18);
        geocodeNote.textContent = `Moved to ${hit.name}. ${check}`;
      } }, "Move the pin to this address"));
      return;
    }
    place(hit.latitude, hit.longitude, "address");
    if (map) map.setView([hit.latitude, hit.longitude], 18);
    geocodeNote.textContent = `Placed from the address: ${hit.name}. ${check}`;
  };
  const find = h("button", { class: "btn small", type: "button", onclick: () => lookUp("button") }, "Find the address on the map");

  /** A street address (a number, then a street) is looked up once typing pauses, or on leaving the field. */
  const onAddress = (soon) => {
    clearTimeout(timer);
    const a = d.address.trim();
    const eligible = /^\d+\s+\S{2,}/.test(a) && (isNew ? !hasCoords() || autoPlaced : a !== original.address);
    if (!eligible) return;
    timer = soon ? setTimeout(() => lookUp("typing"), 1200) : null;
    if (!soon) lookUp("typing");
  };
  const address$ = bound("address", { after: () => onAddress(true) });
  address$.addEventListener("change", () => onAddress(false));

  const number$ = bound("landmarkNumber", { placeholder: "#5" });
  number$.addEventListener("change", () => { d.landmarkNumber = tidyNumber(d.landmarkNumber); number$.value = d.landmarkNumber; touch(); });

  setTimeout(() => {
    if (!haveMap() || !mapBox.isConnected) return;
    const lat = parseFloat(d.latitude), lng = parseFloat(d.longitude);
    const has = isFinite(lat) && isFinite(lng);
    map = L.map(mapBox, { scrollWheelZoom: false }).setView(has ? [lat, lng] : CENTER, has ? 18 : 13);
    tiles(map);
    for (const o of S.landmarks) {
      if (o.id === d.id) continue;
      L.circleMarker([o.latitude, o.longitude], { radius: 4, weight: 1, color: "#fff", fillColor: "#7A6E62", fillOpacity: 0.8 }).bindTooltip(o.name).addTo(map);
    }
    marker = L.marker(has ? [lat, lng] : CENTER, { draggable: true, opacity: has ? 1 : 0.4, icon: L.divIcon({ className: "", html: '<div class="pin"></div>', iconSize: [0, 0] }) }).addTo(map);
    marker.on("dragend", () => { const p = marker.getLatLng(); place(p.lat, p.lng, "hand"); });
    map.on("click", (e) => place(e.latlng.lat, e.latlng.lng, "hand"));
  }, 0);

  const photoNote = h("div", { class: "map-note" });
  /** One line to a photograph, so one that failed isn't lost under the next one's. */
  const show = (lines) => photoNote.replaceChildren(...lines.map(([text, bad]) => h("div", { style: bad ? { color: "var(--vermilion)" } : {} }, text)));
  const thumbOf = (url) => h("img", { class: "thumb", alt: "", src: previewSrc(url), onerror: (e) => { e.target.style.visibility = "hidden"; }, onload: (e) => { e.target.style.visibility = "visible"; } });
  const named = (url) => `Uploaded photograph${printed[url] ? " · " + printed[url] : ""}`;
  const chooser = (multiple, onFiles) =>
    h("input", { type: "file", accept: "image/*", multiple, hidden: true, onChange: (e) => { const files = [...e.target.files]; e.target.value = ""; onFiles(files); } });

  /** Sends photographs to be turned upright, resized to 960 px and printed; `put` is handed each new address. */
  const takePhotos = async (files, put) => {
    const lines = [];
    for (const [n, file] of [...files].entries()) {
      show([...lines, [`Printing ${file.name}…`]]);
      try {
        const out = await sendPhoto(file);
        printed[out.url] = `${out.width} × ${out.height}, ${Math.round(out.bytes / 1000)} KB`;
        put(out.url, n);
        touch();
        drawLead();
        drawPhotos();
        const credited = lastCredit() ? `Credited as "${lastCredit()}"; change it if someone else took it, then save.` : "Say who took it, then save.";
        lines.push([out.warning ? `${file.name}: ${out.warning} ${credited}` : `Printed ${file.name} at ${printed[out.url]}. ${credited}`]);
      } catch (e) {
        lines.push([`${file.name}: ${e.message}`, true]);
      }
      show(lines);
    }
  };
  /** The first photograph fills an empty lead; the rest join the gallery. */
  const putNew = (url) => { if (!d.photoUrl) { d.photoUrl = url; d.credits[url] = lastCredit(); } else d.photos.push({ url, caption: "", credit: lastCredit() }); };

  const leadBox = h("div");
  const drawLead = () => {
    const up = isUpload(d.photoUrl);
    const thumb = thumbOf(d.photoUrl);
    const file$ = chooser(false, (files) => takePhotos(files, (url, n) => (n === 0 ? ((d.photoUrl = url), (d.credits[url] = lastCredit())) : d.photos.push({ url, caption: "", credit: lastCredit() }))));
    leadBox.replaceChildren(h("div", { class: "photo" }, thumb,
      h("div", { class: "fields" },
        h("input", { type: "text", value: up ? named(d.photoUrl) : d.photoUrl, readOnly: up, placeholder: "A web address, or upload a file", "aria-label": "Lead photograph", onInput: (e) => { d.photoUrl = e.target.value; thumb.src = previewSrc(d.photoUrl); touch(); } }),
        up ? h("input", { type: "text", value: d.credits[d.photoUrl] || "", placeholder: "Credit: who took it · licence (required)", "aria-label": "Credit", onInput: (e) => { d.credits[d.photoUrl] = e.target.value; rememberCredit(e.target.value); touch(); } }) : null),
      h("div", { class: "btns2" },
        h("button", { class: "btn small", type: "button", onclick: () => file$.click() }, d.photoUrl ? "Replace…" : "Upload…"),
        d.photoUrl ? h("button", { class: "btn small icon", type: "button", title: "Remove", onclick: () => { d.photoUrl = ""; touch(); drawLead(); } }, "✕") : null,
        file$)));
  };

  const photoRow = (p, i) => {
    const up = isUpload(p.url);
    const thumb = thumbOf(p.url);
    const file$ = chooser(false, (files) => takePhotos(files, (url) => { p.url = url; if (!p.credit) p.credit = lastCredit(); }));
    return h("div", { class: "photo" }, thumb,
      h("div", { class: "fields" },
        h("input", { type: "text", value: up ? named(p.url) : p.url, readOnly: up, placeholder: "A web address, or upload a file", "aria-label": "Photograph", onInput: (e) => { p.url = e.target.value; thumb.src = previewSrc(p.url); touch(); } }),
        h("input", { type: "text", value: p.caption || "", placeholder: "Caption (optional)", "aria-label": "Caption", onInput: (e) => { p.caption = e.target.value; touch(); } }),
        h("input", { type: "text", value: p.credit || "", placeholder: up ? "Credit: who took it · licence (required)" : "Credit — who took it and on what licence", "aria-label": "Credit", onInput: (e) => { p.credit = e.target.value; if (up) rememberCredit(e.target.value); touch(); } })),
      h("div", { class: "btns2" },
        h("button", { class: "btn small", type: "button", onclick: () => file$.click() }, "Replace…"),
        h("button", { class: "btn small icon", type: "button", title: "Remove", onclick: () => { d.photos.splice(i, 1); touch(); drawPhotos(); } }, "✕"),
        file$));
  };
  const gallery = h("div", { class: "card-body", style: { display: "grid", gap: "14px" } });
  const drawPhotos = () => gallery.replaceChildren(...d.photos.map(photoRow));
  drawLead();
  drawPhotos();
  const many$ = chooser(true, (files) => takePhotos(files, putNew));

  const used = isNew ? [] : toursUsing(d.id);

  return h("div", { class: "form" },
    noticeEl(),
    drift ? h("div", { class: "notice warn" }, "The JSON copy of this place differs from the app's:",
      h("table", { class: "diff" }, h("tr", {}, h("th", {}, "Field"), h("th", {}, "In the app"), h("th", {}, "In the JSON")),

/** A value for the difference table: for text, the stretch around where it first differs from `other`, line breaks drawn as ⏎. */
function showAt(v, other) {
  if (typeof v !== "string" || typeof other !== "string") return show(v);
  let i = 0;
  while (i < v.length && i < other.length && v[i] === other[i]) i++;
  const from = Math.max(0, i - 40);
  const to = i + 80;
  return (from ? "…" : "") + v.slice(from, to).replace(/\n/g, "⏎") + (to < v.length ? "…" : "");
}

const show = (v) => (Array.isArray(v) ? (v.length ? `${v.length} photographs` : "—") : v === "" || v == null ? "—" : String(v).length > 220 ? String(v).slice(0, 220) + "…" : String(v));

function tourForm() {
  const d = draft;
  const isNew = pick.tours === "new";
  const saved = isNew ? null : findTour(d.id);
  const stopsBox = h("div");
  const mapBox = h("div", { class: "map tall" });
  let layer = null;

  const drawMap = () => {
    if (!map) return;
    if (layer) layer.remove();
    layer = L.layerGroup().addTo(map);
    const pts = [];
    if (saved && saved.routeCoordinates.length) {
      const line = saved.routeCoordinates.map((p) => [p.latitude, p.longitude]);
      L.polyline(line, { color: d.color, weight: 4, opacity: 0.8 }).addTo(layer);
      pts.push(...line);
    }
    d.stops.forEach((s, i) => {
      const l = byId.get(s.landmarkId);
      if (!l) return;
      pts.push([l.latitude, l.longitude]);
      L.marker([l.latitude, l.longitude], { icon: L.divIcon({ className: "", html: `<div class="num" style="background:${d.color}">${i + 1}</div>`, iconSize: [0, 0] }) }).bindTooltip(l.name).addTo(layer);
    });
    if (pts.length && !map._fitted) { map.fitBounds(pts, { padding: [24, 24] }); map._fitted = true; }
  };

  setTimeout(() => {
    if (!haveMap() || !mapBox.isConnected) return;
    map = L.map(mapBox, { scrollWheelZoom: false }).setView(CENTER, 13);
    tiles(map);
    drawMap();
  }, 0);

  const move = (i, by) => { const j = i + by; if (j < 0 || j >= d.stops.length) return; [d.stops[i], d.stops[j]] = [d.stops[j], d.stops[i]]; touch(); drawStops(); };

  const stopRow = (s, i) => {
    const l = byId.get(s.landmarkId);
    const prev = i ? byId.get(d.stops[i - 1].landmarkId) : null;
    const gap = l && prev ? `${miles(metres(l, prev))} mi from the last stop (straight line)` : l ? l.address : "";
    return h("div", { class: "stop" },
      h("div", { class: "n", style: { background: d.color } }, i + 1),
      h("div", { class: "who" }, h("b", {}, l ? l.name : `Unknown (${s.landmarkId})`), h("small", {}, gap)),
      h("input", { type: "text", value: s.note || "", placeholder: "A line for this stop (optional)", "aria-label": "Note", onInput: (e) => { s.note = e.target.value; touch(); } }),
      h("div", { class: "btns" },
        h("button", { class: "btn small icon", type: "button", title: "Move up", disabled: i === 0, onclick: () => move(i, -1) }, "↑"),
        h("button", { class: "btn small icon", type: "button", title: "Move down", disabled: i === d.stops.length - 1, onclick: () => move(i, 1) }, "↓"),
        h("button", { class: "btn small icon", type: "button", title: "Remove", onclick: () => { d.stops.splice(i, 1); touch(); drawStops(); } }, "✕")));
  };

  const picker = () => {
    const results = h("div", { class: "results", hidden: true });
    const input = h("input", { type: "text", placeholder: "Add a stop — search by name, address or architect", "aria-label": "Add a stop" });
    let hits = [];
    let on = 0;
    const choose = (l) => { d.stops.push({ landmarkId: l.id, note: "" }); touch(); drawStops(); };
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      results.hidden = !q;
      if (!q) return;
      const last = d.stops.length ? byId.get(d.stops[d.stops.length - 1].landmarkId) : null;
      const taken = new Set(d.stops.map((s) => s.landmarkId));
      hits = S.landmarks
        .filter((l) => !taken.has(l.id) && [l.name, l.address, l.architect, l.id].some((x) => (x || "").toLowerCase().includes(q)))
        .map((l) => ({ l, m: last ? metres(l, last) : 0 }))
        .sort((a, b) => (last ? a.m - b.m : sortName(a.l.name).localeCompare(sortName(b.l.name))))
        .slice(0, 8);
      on = 0;
      results.replaceChildren(...(hits.length
        ? hits.map(({ l, m }, i) => h("button", { type: "button", class: i === on ? "on" : "", onmousedown: (e) => e.preventDefault(), onclick: () => choose(l) }, h("b", {}, l.name), " ", h("small", {}, `${l.address}${last ? ` · ${miles(m)} mi from the last stop` : ""}`)))
        : [h("div", { style: { padding: "9px 11px", color: "var(--sepia)" } }, "Nothing in the guide matches.")]));
    };
    input.addEventListener("input", draw);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && hits[0]) { e.preventDefault(); choose(hits[0].l); } if (e.key === "Escape") { input.value = ""; draw(); } });
    input.addEventListener("blur", () => { setTimeout(() => { results.hidden = true; }, 250); }); // after a tap on a result has landed
    input.addEventListener("focus", draw);
    return h("div", { class: "picker" }, input, results);
  };

  const drawStops = () => {
    stopsBox.replaceChildren(...d.stops.map(stopRow), picker());
    drawMap();
  };
  drawStops();

  const problems = saved ? saved.problems : [];
  const running = S.job && S.job.status === "running";

  return h("div", { class: "form" },
    noticeEl(),
    saved && problems.length ? h("div", { class: "notice warn" }, "This walk's route needs attention:",
      h("ul", {}, ...problems.map((p) => h("li", {}, p))),
      h("div", {}, h("button", { class: "btn small", style: { marginRight: "8px" }, disabled: dirty || running, title: dirty ? "Save your changes first" : "", onclick: () => runTask("route", saved.id) }, "Draw the route along the streets"))) : null,

    h("div", { class: "card" }, h("h3", {}, "The walk"),
      h("div", { class: "row lead" }, field("Name", bound("name")), field("Neighborhood", bound("neighborhood"))),
      h("div", { class: "row lead" }, field("Author", bound("author")),
        field("Colour", h("input", { type: "color", value: d.color, onInput: (e) => { d.color = e.target.value; touch(); drawStops(); } }))),
      field("Description", bound("description", { area: true, rows: 4 }))),

    h("div", { class: "card" }, h("h3", {}, "Stops, in walking order"), stopsBox,
      saved ? h("div", { class: "map-note" }, `${saved.distance} · ${saved.duration} on the route as drawn. Changing the stops resets the route to a straight line until it is drawn again.`) : h("div", { class: "map-note" }, "A new walk starts as a straight line between its stops. After saving, draw it along the streets.")),

    h("div", { class: "card" }, h("h3", {}, "Map"), haveMap() ? mapBox : mapMissing()),

    saved ? h("div", { class: "card" }, h("h3", {}, "After a change"),
      h("div", { class: "map-note" }, "The route, the street names on the fold-out map, and the fold-out map itself are drawn by scripts. Run them in this order once the stops are as you want them."),
      h("div", {}, h("button", { class: "btn small", style: { marginRight: "8px" }, disabled: dirty || running, onclick: () => runTask("route", saved.id) }, "1. Draw the route"),
        h("button", { class: "btn small", disabled: dirty || running, onclick: () => runTask("plate", saved.id) }, "2. Print the fold-out map"))) : null,
  );
}

async function save(force) {
  const isNew = pick[tab] === "new";
  if (!force && !dirty && !isNew) return;
  const kind = tab;
  const data = clone(draft);
  if (kind === "landmarks") { data.latitude = data.latitude === "" ? NaN : data.latitude; data.longitude = data.longitude === "" ? NaN : data.longitude; }
  try {
    const out = await api(isNew ? "POST" : "PUT", isNew ? `/${kind}` : `/${kind}/${data.id}`, data);
    const saved = kind === "landmarks" ? out.landmark : out.tour;
    pick[kind] = saved.id;
    await refresh(true);
    if (kind === "landmarks") {
      notice = { kind: out.warnings && out.warnings.length ? "warn" : "ok", text: isNew ? "Added to the guide." : "Saved.", list: out.warnings };
      const t = toursUsing(saved.id).filter((x) => x.problems.length);
      if (t.length) notice = { kind: "warn", text: "Saved. These walks now need their routes redrawn:", list: t.map((x) => x.name) };
    } else {
      const t = findTour(saved.id);
      notice = t.problems.length
        ? { kind: "warn", text: "Saved. " + t.problems[0], action: { label: "Draw the route along the streets", run: () => runTask("route", t.id) } }
        : { kind: "ok", text: "Saved." };
    }
    loadDraft();
    renderAll();
    // New or changed photographs are printed into the app (and credited) as soon as the entry is saved.
    if (kind === "landmarks" && out.photosChanged) runTask("photos");
  } catch (e) {
    notice = { kind: "err", text: e.message, list: e.details };
    renderDetail(true);
    toTop();
  }
}

async function remove() {
  const id = pick[tab];
  const name = draft.name || id;
  const what = tab === "landmarks"
    ? `Delete ${name} from the guide? It comes out of the app's data and the JSON. (The database keeps its row.)`
    : `Delete the walk ${name}? Its baked street names and fold-out map stay in the repo until you remove them.`;
  if (!confirm(what)) return;
  try {
    await api("DELETE", `/${tab}/${id}`);
    pick[tab] = null;
    await refresh(true);
    loadDraft();
    notice = { kind: "ok", text: `Deleted ${name}.` };
    renderAll();
    if (history.state && history.state.detail) history.back();
  } catch (e) {
    notice = { kind: "err", text: e.message, list: e.details };
    renderDetail(true);
  }
}

        h("div", { class: "code", "aria-label": "Passcode" }, info.passcode),

        others.length ? h("details", {}, h("summary", { class: "map-note" }, "Other addresses"), h("div", { class: "lines", style: { marginTop: "8px" } }, ...others.map((w) => h("div", {}, h("b", {}, w.label), h("div", { class: "map-note", style: { overflowWrap: "anywhere" } }, w.url))))) : null,
        h("ol", {},
          h("li", {}, first && /Tailscale/.test(first.label) ? "The Tailscale address works from anywhere, as long as the Tailscale app is turned on, on the iPhone." : "Away from home, turn on Tailscale on the Mac and the iPhone and use the Tailscale address."),
          h("li", {}, "The Wi-Fi addresses work only while the iPhone and this Mac are on the same network."),
          h("li", {}, "In Safari, Share, then Add to Home Screen, puts the editor on the Home Screen like an app."),

let polling = false;

async function runTask(name, arg) {
  try {
    await api("POST", "/run", { task: name, arg });
    $("console").classList.add("on");
    poll();
    await refresh(true);
  } catch (e) {
    notice = { kind: "err", text: e.message, list: e.details };
    renderDetail(true);
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const { job } = await api("GET", "/job");
      if (!job) break;
      $("led").className = `led ${job.status}`;
      $("job-label").textContent = job.label;
      $("job-status").textContent = job.status === "running" ? "running…" : job.status === "ok" ? "finished" : "stopped";
      const out = $("job-out");
      const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 20;
      out.textContent = job.output;
      if (atEnd) out.scrollTop = out.scrollHeight;
      if (job.status === "failed") $("console").classList.add("open");
      // On a phone the notice covers the top of the page, so a job that went well clears itself.
      if (job.status === "ok" && onPhone() && !$("console").classList.contains("open")) setTimeout(() => $("console").classList.remove("on"), 4000);
      if (job.status !== "running") {
        await refresh(true);
        if (!dirty) { loadDraft(); renderDetail(true); }
        break;
      }
      await sleep(800);
    }
  } finally {
    polling = false;
  }
}

$("close-console").onclick = () => $("console").classList.remove("on");
$("console").querySelector("header").addEventListener("click", (e) => { if (!e.target.closest("button")) $("console").classList.toggle("open"); });

  renderHeader();

async function refresh(quiet) {
  S = await api("GET", "/state");

}

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(false); }
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

refresh().then(() => { if (S.job) { $("console").classList.add("on"); poll(); } }).catch((e) => {
  $("detail").replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Couldn't load the guide"), e.message));
});
</script>
</body>
